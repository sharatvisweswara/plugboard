<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ask-queue</title>
<style>
  :root {
    --bg: #f6f6f4; --card: #fff; --fg: #1c1c1a; --muted: #6b6b66;
    --line: #e2e2dd; --accent: #2f5bd3; --accent-fg: #fff; --chip: #ecece7;
    --ok: #2e7d4f; --warn: #a15c00;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161615; --card: #20201e; --fg: #ececea; --muted: #9a9a94;
      --line: #33332f; --accent: #7d9cff; --accent-fg: #10131c; --chip: #2b2b28;
      --ok: #6fcf97; --warn: #f2b45c;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg);
         font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 24px 16px 64px; }
  h1 { font-size: 18px; margin: 0 0 16px; }
  h1 span { color: var(--muted); font-weight: 400; }
  .empty { color: var(--muted); padding: 48px 0; text-align: center; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px;
          padding: 16px; margin-bottom: 16px; }
  .meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center;
          font-size: 13px; color: var(--muted); margin-bottom: 10px; }
  .chip { background: var(--chip); border-radius: 4px; padding: 1px 6px; }
  .label { color: var(--fg); font-weight: 600; }
  .waiting { color: var(--ok); }
  .working { color: var(--muted); }
  .silent { color: var(--warn); }
  details { margin: 0 0 12px; font-size: 13px; }
  details pre { white-space: pre-wrap; background: var(--chip); padding: 8px;
                border-radius: 6px; max-height: 240px; overflow: auto; margin: 6px 0 0; }
  .q { border-top: 1px solid var(--line); padding-top: 12px; margin-top: 12px; }
  .q:first-of-type { border-top: 0; margin-top: 0; padding-top: 0; }
  .q-head { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
  .q-text { font-weight: 600; margin: 2px 0 8px; }
  .opt { display: flex; gap: 8px; align-items: flex-start; padding: 6px 8px;
         border-radius: 6px; cursor: pointer; }
  .opt:hover { background: var(--chip); }
  .opt small { display: block; color: var(--muted); }
  .opt > span { min-width: 0; flex: 1; }
  .preview { font: 12px/1.35 ui-monospace, SFMono-Regular, Menlo, monospace; background: var(--chip);
             border-radius: 6px; padding: 8px; margin: 6px 0 2px; overflow-x: auto; white-space: pre; }
  input[type=text], textarea { width: 100%; font: inherit; color: var(--fg); background: var(--bg);
         border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; }
  textarea { min-height: 60px; resize: vertical; }
  .other { margin-top: 6px; }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
  button { font: inherit; border-radius: 6px; padding: 6px 14px; cursor: pointer;
           border: 1px solid var(--line); background: var(--card); color: var(--fg); }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
  .more { display: none; margin-top: 10px; }
  .more.open { display: block; }
  .err { color: var(--warn); font-size: 13px; margin-top: 8px; }
</style>
</head>
<body>
<main>
  <h1>ask-queue <span id="count"></span></h1>
  <div id="list"></div>
</main>
<script>
const list = document.getElementById("list");
const count = document.getElementById("count");
let shown = null;  // key of the last render; null forces a rebuild

function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

function ago(ts) {
  const s = Math.floor(Date.now() / 1000 - ts);
  if (s < 60) return s + "s ago";
  if (s < 3600) return Math.floor(s / 60) + "m ago";
  return Math.floor(s / 3600) + "h " + Math.floor((s % 3600) / 60) + "m ago";
}

function render(asks) {
  count.textContent = asks.length ? "(" + asks.length + " waiting)" : "";
  document.title = asks.length ? "(" + asks.length + ") ask-queue" : "ask-queue";
  // Keep in-progress input: only rebuild when the set of asks changes.
  const key = asks.map(a => a.id + ":" + sessionStatus(a)[0]).join(",");
  // Never rebuild while an answer is counting down: it would drop the Undo button.
  if (key === shown || Object.keys(pending).length) {
    asks.forEach(a => {
      const el = document.querySelector('[data-age="' + a.id + '"]'); if (el) el.textContent = ago(a.created_at);
      const st = document.querySelector('[data-status="' + a.id + '"]'); if (st) st.textContent = sessionStatus(a)[1];
    });
    return;
  }
  const keep = {};
  list.querySelectorAll("input, textarea").forEach(el => {
    keep[el.name + "|" + el.value] = el.type === "radio" || el.type === "checkbox" ? el.checked : el.value;
  });
  shown = key;
  if (!asks.length) { list.innerHTML = '<div class="empty">No questions waiting.</div>'; return; }
  list.innerHTML = asks.map(cardHtml).join("");
  list.querySelectorAll("input, textarea").forEach(el => {
    const k = el.name + "|" + el.value;
    if (el.type === "radio" || el.type === "checkbox") { if (keep[k]) el.checked = true; }
    else { const prev = Object.keys(keep).find(x => x.startsWith(el.name + "|")); if (prev) el.value = keep[prev]; }
  });
}

// A session with a recent hook request is working on something (often on an
// answer it just got); one silent for an hour may have stopped.
const SILENT_SECONDS = 3600;

function sessionStatus(a) {
  if (a.session_waiting) return ["waiting", "● session waiting"];
  if (a.last_seen == null) return ["silent", "● no contact since the hub started"];
  if (Date.now() / 1000 - a.last_seen < SILENT_SECONDS) return ["working", "● session working · seen " + ago(a.last_seen)];
  return ["silent", "● no contact · seen " + ago(a.last_seen)];
}

function cardHtml(a) {
  const repo = a.cwd ? a.cwd.split("/").filter(Boolean).pop() : "?";
  const qs = a.questions.map((q, i) => {
    const name = "a" + a.id + "q" + i;
    const type = q.multiSelect ? "checkbox" : "radio";
    const opts = (q.options || []).map(o =>
      '<label class="opt"><input type="' + type + '" name="' + name + '" value="' + esc(o.label) + '">' +
      '<span>' + esc(o.label) + (o.description ? '<small>' + esc(o.description) + '</small>' : '') +
      (o.preview ? '<pre class="preview">' + esc(o.preview) + '</pre>' : '') + '</span></label>'
    ).join("");
    return '<div class="q"><div class="q-head">' + esc(q.header) + '</div>' +
      '<div class="q-text">' + esc(q.question) + '</div>' + opts +
      '<input class="other" type="text" name="' + name + 'other" placeholder="Other (free text, replaces the selection)"></div>';
  }).join("");
  const [cls, text] = sessionStatus(a);
  const status = '<span class="' + cls + '" data-status="' + a.id + '">' + text + '</span>';
  return '<div class="card" id="ask' + a.id + '">' +
    '<div class="meta"><span class="label">' + esc(a.label) + '</span>' +
    (a.host ? '<span class="chip">' + esc(a.host) + '</span>' : '') +
    '<span class="chip">' + esc(repo) + '</span>' +
    (a.branch ? '<span class="chip">' + esc(a.branch) + '</span>' : '') +
    '<span data-age="' + a.id + '">' + ago(a.created_at) + '</span>' + status + '</div>' +
    (a.context ? '<details><summary>Session context</summary><pre>' + esc(a.context) + '</pre></details>' : '') +
    qs +
    '<div class="actions">' +
      '<button class="primary" onclick="send(' + a.id + ')">Send answers</button>' +
      '<button onclick="toggleMore(' + a.id + ')">Need more info…</button></div>' +
    '<div class="more" id="more' + a.id + '"><textarea name="a' + a.id + 'more" placeholder="What do you need to know?"></textarea>' +
      '<div class="actions"><button class="primary" onclick="more(' + a.id + ')">Send request</button></div></div>' +
    '<div class="err" id="err' + a.id + '"></div></div>';
}

function toggleMore(id) { document.getElementById("more" + id).classList.toggle("open"); }

// Answers wait UNDO_SECONDS in the page before they are sent, so a misclick can be taken back.
const UNDO_SECONDS = 5;
const pending = {};

function post(body, id) {
  if (pending[id]) return;
  const card = document.getElementById("ask" + id);
  const err = document.getElementById("err" + id);
  card.querySelectorAll("button").forEach(b => b.disabled = true);
  let left = UNDO_SECONDS;
  const tick = () => {
    err.innerHTML = "Sending in " + left + "s… <button onclick=\"undo(" + id + ")\">Undo</button>";
    err.querySelector("button").disabled = false;
  };
  tick();
  pending[id] = setInterval(async () => {
    left -= 1;
    if (left > 0) { tick(); return; }
    clearInterval(pending[id]);
    err.textContent = "Sending…";
    const r = await fetch("/api/answer", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)});
    delete pending[id];
    if (r.status === 409) err.textContent = "Already answered.";
    else if (!r.ok) { err.textContent = (await r.json()).error || "failed"; card.querySelectorAll("button").forEach(b => b.disabled = false); return; }
    shown = null;
    load();
  }, 1000);
}

function undo(id) {
  clearInterval(pending[id]);
  delete pending[id];
  const card = document.getElementById("ask" + id);
  card.querySelectorAll("button").forEach(b => b.disabled = false);
  document.getElementById("err" + id).textContent = "";
}

function send(id) {
  const card = document.getElementById("ask" + id);
  const answers = {};
  let missing = false;
  card.querySelectorAll(".q").forEach((qel, i) => {
    const text = qel.querySelector(".q-text").textContent;
    const other = qel.querySelector('input[name="a' + id + 'q' + i + 'other"]').value.trim();
    const picked = [...qel.querySelectorAll('input[name="a' + id + 'q' + i + '"]:checked')].map(x => x.value);
    const val = other || picked.join(", ");
    if (!val) missing = true;
    answers[text] = val;
  });
  if (missing) { document.getElementById("err" + id).textContent = "Answer every question, or use Need more info."; return; }
  post({id, kind: "answer", answers}, id);
}

function more(id) {
  const note = document.querySelector('textarea[name="a' + id + 'more"]').value.trim();
  post({id, kind: "more_info", note}, id);
}

async function load() {
  try { render(await (await fetch("/api/inbox")).json()); }
  catch (e) { count.textContent = "(daemon unreachable)"; }
}
load();
setInterval(load, 3000);
</script>
</body>
</html>
